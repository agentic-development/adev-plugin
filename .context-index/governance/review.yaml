# review.yaml — Reviewer registry
# This file lives at .context-index/governance/review.yaml
# Generated by /adev:init. Edit as needed.
#
# Reviewers are no longer bundled-by-default: this file is the WHOLE reviewer
# set (explicit-governance-registries).
#
# Reconciled 2026-08-19 against the reviewer-domain-fit retarget
# (.context-index/specs/features/reviewer-domain-fit/reviewer-panel-retarget.spec.md):
# structural-architect and security-reviewer are disabled (not deleted) in
# favor of the panel retargeted for this project's shape (Node CLI/plugin) —
# referent-integrity, wiring-reviewer, consistency-analyzer (expanded scope),
# boundary-reviewer, termination-reviewer. This repo's own hand-added
# referent-integrity entry (added 2026-05-11-era, Phase 1 of the same
# initiative) was retired in the same change per that spec's Migration Path
# Step 6, so the bundled version is the only one in this file.
#
# Reviewer schema:
#   id:        (required) Unique identifier
#   dispatch:  always | triggered (default: triggered)
#   profile:   reviewer-capable | read-only (default: reviewer-capable)
#   prompt:    Path to reviewer prompt file
#   patterns:  File glob patterns that trigger this reviewer
#   keywords:  Keywords that trigger this reviewer
#   min_score: Minimum keyword match score to trigger (default: 1)
#
# NOTE: Eight project-domain reviewers were previously declared here but
# referenced prompt files at `.context-index/prompts/*.md` that do not
# exist on disk. The path resolver double-prefixed the `.context-index/`
# segment when resolving them, causing /adev:review-specs to abort with
# FILE_MISSING errors. The entries were stripped on 2026-05-11; to
# reintroduce domain reviewers, create the prompt files first, then add
# entries with a path relative to `.context-index/` (i.e., `prompts/...`,
# not `.context-index/prompts/...`).

reviewers:
  - id: structural-architect
    name: Structural Architect
    dispatch: always
    profile: reviewer-reasoning
    context_pack: base
    severity_cap: blocker
    prompt: plugin:review-specs/structural-architect-prompt.md
    source: domain:software
    enabled: false
    disabled_reason: "Disabled as part of the reviewer-domain-fit initiative. OWASP/structural scope was retargeted to referent-integrity/wiring-reviewer/consistency-analyzer/boundary-reviewer for the default (Node CLI/plugin) project shape. Prompt retained on disk; still resolvable for any project whose materialized review.yaml already names it."
  - id: security-reviewer
    name: Security Reviewer
    dispatch: always
    profile: reviewer-capable
    context_pack: base
    severity_cap: blocker
    prompt: plugin:review-specs/security-reviewer-prompt.md
    source: domain:software
    enabled: false
    disabled_reason: "Disabled as part of the reviewer-domain-fit initiative. OWASP-scoped review relocated to the web-service domain extension (opt-in via adev extension install web-service) where it fits the artifact class. Prompt retained on disk."
  - id: consistency-analyzer
    name: Consistency Analyzer
    dispatch: always
    profile: reviewer-fast
    context_pack: base
    severity_cap: blocker
    prompt: plugin:review-specs/consistency-analyzer-prompt.md
    source: domain:software
  - id: referent-integrity
    name: Referent Integrity Reviewer
    dispatch: always
    profile: reviewer-reasoning
    context_pack: referent-integrity
    severity_cap: blocker
    prompt: plugin:review-specs/referent-integrity-prompt.md
    source: domain:software
  - id: wiring-reviewer
    name: Wiring Reviewer
    dispatch: always
    profile: reviewer-capable
    context_pack: wiring
    severity_cap: blocker
    prompt: plugin:review-specs/wiring-reviewer-prompt.md
    source: domain:software
  - id: boundary-reviewer
    name: Boundary Reviewer
    dispatch: always
    profile: reviewer-capable
    context_pack: security
    severity_cap: blocker
    prompt: plugin:review-specs/boundary-reviewer-prompt.md
    source: domain:software
  - id: termination-reviewer
    name: Termination Reviewer
    dispatch:
      triggered:
        keywords: ["loop", "retry", "poll", "polling", "iterate", "iteration", "recurring", "convergence", "auto-retry"]
        min_score: 1
    profile: reviewer-fast
    context_pack: base
    severity_cap: blocker
    prompt: plugin:review-specs/termination-reviewer-prompt.md
    source: domain:software

