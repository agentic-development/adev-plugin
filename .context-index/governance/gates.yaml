# gates.yaml — Quality gate definitions and lifecycle transition requirements
# This file lives at .context-index/governance/gates.yaml
# Generated by /adev:init. Edit as needed.
#
# Gate schema:
#   id:        (required) Unique identifier for the gate
#   name:      Display name
#   kind:      deterministic | probabilistic (default: deterministic)
#   tier:      fast | integration | e2e (default: fast)
#   command:   (required for deterministic gates) An argv LIST, never a shell string.
#              e.g., command: [npm, test]
#              A string value is rejected at load by lib/domains/merge-gates.mjs with
#              INVALID_GATE: Gate '<id>' command must be an argv list (array), not a
#              string — skipped. Commands are executed without shell interpolation,
#              so a chained shell string such as `npm test && npm run lint` is not a
#              valid gate — declare two gates instead.
#   scope:     project | charter (default: project)
#   required:  true | false (default: true). When false, severity is forced to warning.
#   severity:  error | warning. Defaults: error for fast/integration, warning for e2e.
#   triggers:  List of lifecycle events (e.g., post-task, post-implement, pre-merge)
#   group:     (e2e tier only) smoke | full. Smoke runs before full.
#              Severity defaults: error for smoke, warning for full.
#
# Tier execution order: fast → integration → e2e
# An error-severity gate failure stops remaining gates in the tier and all subsequent tiers.
# A warning-severity gate failure is recorded but does not stop execution.

# Gate definitions
gates:
  - id: test
    name: Test Suite
    kind: deterministic
    tier: fast
    command: ["npm", "test"]
    scope: project
    required: true
    severity: error
    triggers:
      - post-task
      - post-implement
  - id: quality-gate
    command: ["npm", "test"]
    description: Run project test suite
    severity: error
    tier: fast
    source: domain:software

  # The integration tier. `npm test` deliberately excludes tests/evals/ —
  # scripts/run-tests.mjs splits them into an opt-in tier — so without this gate
  # the eval suites are declared and never executed by any gate, which is the
  # exact failure mode issue-552 exists to catch.
  #
  # required: false (→ severity warning) until the eval tier is green again.
  # Measured 2026-08-14: 361 tests, 334 pass, 27 fail (issue-590, issue-591,
  # issue-592). Promote to required: true once those close.
  - id: integration-test
    name: Integration Tests (eval tier)
    kind: deterministic
    tier: integration
    command: [npm, run, test:evals]
    scope: project
    required: false
    severity: warning
    triggers:
      - post-implement

  # - id: lint
