  # NOTE: the commented `integration-test` scaffold example that used to sit
  # here was REMOVED. `integration-test` is now a LIVE entry above (the eval-tier
  # gate), so uncommenting the example would have declared the id twice — a
  # duplicate whose merge behaviour is silent last-wins. The software domain's
  # own materialized `integration-test` (a no-op until a `test:integration`
  # script exists) collided with this same id and was dropped in favor of the
  # eval-tier gate, which actually runs something. Only add a commented
  # template for an id that no live entry already declares.

# Lifecycle transition requirements
#
# Each entry names the gates that must have a FRESH, ATTESTED, PASSING outcome
# recorded by validate's Check 1 before the transition is allowed. Nothing here
# executes a gate — `adev gate transitions` reads recorded history only.
#
# Only gates carrying a real argv `command` may be named. `lint` and `typecheck`
# below are commented-out templates with no command, so requiring them would
# produce a required_gates id no gate declares — the MISSING_GATE_REF finding
# /adev:hygiene Pass 8 raises. Uncomment the gate first, then add it here.
transitions:
  implement-to-validate:
    required_gates:
      - test
    approver_role: ""

  validate-to-merge:
    required_gates:
      - test
    approver_role: ""

