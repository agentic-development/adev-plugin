# risk-policies.yaml — Risk level to gate escalation mapping
# This file lives at .context-index/governance/risk-policies.yaml
# Specs declare risk_level in frontmatter (high | medium | low).
# If not declared, default is "medium".
#
# review_mode / validate_mode set the GRADUATED RIGOR TIER for the two gate
# skills (full | quick). `quick` does NOT skip the gate — /adev:review-specs runs
# a single synthesized reviewer and /adev:validate runs quality gates + one
# synthesized compliance check, still emitting their lifecycle events so the
# strict gate chain stays satisfied. Absent → full. An explicit `--tier` or a
# routing "easy" signal overrides these. See
# .context-index/specs/cross-cutting/graduated-rigor-tiers.spec.md.
#
# implement_mode sets /adev:implement's per-task review depth: full | quick,
# or lite — which authorizes inline, unreviewed execution only for
# route-eligible tasks on non-high-risk specs with no floor leg and no
# --parallel; any other task resolves quick or full. A lite task is re-checked
# after it runs: an undeclared path outside tests/, docs/, test files and
# READMEs (never `*.spec.md`, `.context-index/` or symlinks) raises it to
# quick, and a sensitive or boundary path (gitignored files it wrote
# included) raises it to full. Absent → quick. `quick`
# is a baseline, not a guarantee: it runs one synthesized reviewer
# per task; the floor pass still raises a task to full (two-stage review) when
# the spec is high-risk and the task is not routed auto-agent, when it touches a
# boundary or sensitive path, when it is routed human-only, or on a Critical
# finding. `lite` is never valid for high, and is set only by an operator's
# choice (/adev:init's implement-rigor prompt, or by hand). See
# .context-index/specs/features/implementation/implement-rigor-ladder.spec.md.

policies:
  high:
    require_review: true
    require_hitl_approval: true
    review_mode: full
    validate_mode: full
    implement_mode: quick
    test_depth: thorough
    additional_gates: []           # gate IDs from gates.yaml
  medium:
    require_review: true
    require_hitl_approval: false
    review_mode: full
    validate_mode: full
    implement_mode: quick
    test_depth: standard
    additional_gates: []
  low:
    require_review: true           # low-risk still reviews — but quickly
    require_hitl_approval: false
    review_mode: quick
    validate_mode: quick
    implement_mode: quick
    test_depth: minimal
    additional_gates: []
