# validate.yaml — Project validate registry (single source post-restructure).
#
# Post-check-set-restructure.spec.md:
#  - check-10-platform-drift was removed from the starter (migrated to
#    /adev:hygiene Audit Pass 20). The previously-disabled entry is no longer
#    needed; references to removed IDs now warn as RESURRECTED_CHECK_ID.
#  - check-11-visual-verification remains in the starter but is now
#    self-guarded: it SKIPs (not BLOCKs) when no UI files match the
#    implementation diff, so the project no longer needs to disable it
#    locally to keep validate running on non-UI specs.
#
# This file is the single source of truth for validate checks in this
# project. To re-enable or override defaults, copy the relevant entry from
# templates/domains/software/validate.yaml here.
#
# Entries below were copied from the software domain starter on 2026-05-17
# to populate the previously-empty registry (issue-507). Check 1 (quality
# gates) was added on 2026-08-15 by explicit-governance-registries.spec.md:
# its *gate set* is still sourced from governance/gates.yaml, but the check
# itself is now a declared row so its severity is `error` rather than the
# UNKNOWN_VALIDATOR_DEFAULTED fallback of `warning`.

checks:
  # Check 1 (explicit-governance-registries.spec.md). Fail-fast: a failing
  # quality gate stops validation, so `error` is the only honest severity.
  # This check is the SOLE sanctioned writer of `gate_outcomes` on a
  # `validator_report` — see the prompt body.
  - id: validate.check-1-quality-gates
    name: "Quality Gates"
    kind: deterministic-check
    severity: error
    fail_fast: true
    prompt: plugin:validate/checks/validate.check-1-quality-gates.md
    description: "Run the resolved gate set and record per-gate outcomes."

  - id: validate.check-1.5-source-manifest
    name: "Source Manifest Verification"
    kind: deterministic-check
    severity: warning
    prompt: plugin:validate/checks/validate.check-1.5-source-manifest.md
    description: "Verify spec source-manifest SHAs match current files."

  - id: validate.check-2-spec-compliance
    name: "Spec Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: error
    prompt: plugin:validate/checks/validate.check-2-spec-compliance.md
    after: [validate.check-1.5-source-manifest]

  - id: validate.check-4-constitution
    name: "Constitutional Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: error
    prompt: plugin:validate/checks/validate.check-4-constitution.md
    after: [validate.check-2-spec-compliance]

  - id: validate.check-8-boundaries
    name: "Governance Boundaries"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: error
    prompt: plugin:validate/checks/validate.check-8-boundaries.md
    after: [validate.check-2-spec-compliance]

  - id: validate.check-9-transition-gates
    name: "Transition Gate Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: warning
    prompt: plugin:validate/checks/validate.check-9-transition-gates.md
    after: [validate.check-2-spec-compliance]

  - id: validate.check-11-visual-verification
    name: "Visual Verification"
    kind: subagent-review
    profile: browser-review
    context_pack: base
    severity: warning
    prompt: plugin:validate/checks/validate.check-11-visual-verification.md

  # Gate Doctor (unified-gates/gate-doctor.spec.md).
  - id: validate.check-14-gate-executability
    name: "Gate Executability and Test Collection"
    kind: deterministic-check
    severity: warning
    prompt: plugin:validate/checks/validate.check-14-gate-executability.md
    description: "Verify declared gates can run and declared tests get collected."
    after: [validate.check-1.5-source-manifest]
