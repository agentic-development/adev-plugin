# Platform Context — adev-plugin
# Generated by /adev:init. Describes the tech stack for agent decision-making.

framework: none  # CLI tool / plugin, not a web framework
language: javascript
module_system: esm
runtime: nodejs
test_runner: "node:test"
package_manager: npm
deployment: npm registry  # npx @adev-org/adev-cli install
plugin_target: claude-code

# ============================================================================
# Model Tier Configuration
# ============================================================================

# Set to provider model IDs. Skills fall back to built-in defaults if absent.
# See .context-index/specs/cross-cutting/model-routing.md for tier semantics.

model_tiers:
  fast:      claude-haiku-4-5-20251001  # pattern matching, diffs, gaming detection
  capable:   claude-sonnet-5           # code generation, test authoring, behavioral reasoning
  reasoning: claude-opus-5             # architecture review, cross-cutting analysis
