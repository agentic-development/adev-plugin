# manifest.yaml — Agentic Development Framework Configuration
# Generated by /adev:init. Edit as needed, then run /adev:sync.

# ============================================================================
# Project Metadata
# ============================================================================

project:
  name: "adev-plugin"
  adev_version: "0.28.0-next.2"
  description: "Claude Code plugin and CLI implementing a full-lifecycle Agentic Development Framework"
  type: cli

# ============================================================================
# Sync Targets
# ============================================================================

sync:
  targets:
    - path: CLAUDE.md
      format: claude

# ============================================================================
# Modules
# ============================================================================

modules:
  - slug: cli
    name: CLI
    paths:
      - cli/

  - slug: hooks
    name: Hooks
    paths:
      - hooks/

  - slug: lib
    name: Core Libraries
    paths:
      - lib/

  - slug: setup
    name: Setup
    paths:
      - skills/init/
      - skills/sync/
      - skills/using-adev/
      - templates/

  - slug: triage
    name: Triage
    paths:
      - skills/work/

  - slug: design
    name: Design
    paths:
      - skills/brainstorm/
      - skills/specify/

  - slug: assessment
    name: Assessment
    paths:
      - skills/review-specs/
      - skills/route/
      - skills/assess/

  - slug: planning
    name: Planning
    paths:
      - skills/plan/

  - slug: implementation
    name: Implementation
    paths:
      - skills/implement/
      - skills/debug/
      - skills/recover/
      - skills/write-test/

  - slug: validation
    name: Validation
    paths:
      - skills/validate/
      - skills/eval/

  - slug: strategic-planning
    name: Strategic Planning
    paths:
      - skills/research/
      - skills/build/
      - skills/issues/
      - skills/status/
      - skills/document/

  - slug: maintenance
    name: Maintenance
    paths:
      - skills/hygiene/
      - skills/repomap/
      - skills/codehealth/
      - skills/sample/
      - skills/retro/
      - skills/reconcile/

# ============================================================================
# External Contexts
# ============================================================================

external_contexts: []

# ============================================================================
# Specialists
# ============================================================================

specialists: []

# ============================================================================
# Quality Gates
# ============================================================================

# Gate definitions live in .context-index/governance/gates.yaml (post-0.26.0).
# The legacy top-level `gates:` block here is no longer read.

# ============================================================================
# Completion Policy
# ============================================================================

completion:
  merge_policy: pr
  protected_branches:
    - main
    - master
  branch_naming: "<type>/<module>/<short-description>"

  # May an agent run `gh pr merge` to complete a PR? Opening the PR is never
  # gated; completing it is, because merge is where review is enforced.
  # Read by hooks/merge-guard.sh. Left at the default so behaviour is unchanged
  # — set true only if you want agents merging their own PRs here.
  allow_agent_pr_merge: false

# ============================================================================
# Task Management
# ============================================================================

# Build pipeline. `max_review_retries` bounds the BLOCK -> revise loop in
# `/adev:build --full`. Raised from the default 2 on 2026-08-15: high-risk
# specs reviewed at full tier converge monotonically but need more than two
# rounds, and the loop was halting at BUDGET_EXHAUSTED mid-convergence
# (heuristics Phase 3 went 6 -> 2 -> 1 blockers across three rounds).
build:
  max_review_retries: 9

# implement:
#   batch_mode: on          # on | off — default on (Requires Human Approval; see
#                            # batched-task-dispatch.spec.md System Constitution Reference)
#   max_batch_size: 4       # integer >= 1 — cap on tasks per batch

tasks:
  backend: beads

  # Lease window for `adev issues claim`. A claim is a lease, not a lock: once
  # claimed_at is older than this, the claim is STALE and the next claimant
  # takes it over with a fresh claimed_at, so a crashed session cannot hold an
  # issue forever. A LIVE claim by another owner is still refused
  # (ISSUE_ALREADY_CLAIMED). Set 0 to disable expiry.
  # List expired leases with `adev issues stale [--json]`.
  claim_ttl_minutes: 240

# ============================================================================
# Test Policy
# Controls test granularity and risk-based depth escalation, consumed by
# /adev:plan, /adev:write-test, /adev:implement, and `adev test-policy`.
# Per-module overrides: modules[].test_policy.granularity.
# See .context-index/specs/features/test-strategies/test-depth-policy.spec.md
# ============================================================================

test_policy:
  granularity: per-behavior   # per-task | per-behavior | per-spec
  escalation: true            # allow risk-based depth escalation on top of granularity

# ============================================================================
# Lifecycle State
# ============================================================================

# Controls how requireGate behaves on a missing/failed prior step.
#   strict   — throw GateError (default)
#   advisory — emit console.warn and continue
# lifecycle:
#   gate_mode: strict

# Partial-artifact (`.partial` + atomic-rename) knobs — incremental-artifact-writes.spec.md.
# These knobs govern lifecycle-artifact write-state, which is a lifecycle concern
# even though the per-knob behavior is artifact-byte-management (CON-9 recommendation B).
# lifecycle:
#   partial_stale_seconds: 30           # lock-steal threshold (default 30)
#   partial_stale_hours:   24           # orphan-content sweep threshold (default 24)
#   partial_oversize_multiplier: 3      # runaway-write guard (default 3× expected size)
#   partial_expected_size_default: 51200  # floor for expected size when no prior version exists (bytes, default 50 KB)
#   partial_roots: []                   # optional containment-allowlist roots beyond .context-index/

# ============================================================================
# Heuristics
# ============================================================================

# Budget knobs for heuristic injection into context packets, consumed by
# `adev heuristics retrieve` and the lifecycle skills that call it.

# Cap on entries injected at ERROR time — i.e. any `adev heuristics retrieve`
# carrying a `--signature`, which is by definition a mid-task failure lookup.
# Default 3. Deliberately NOT the entry-time default of 8, and never inherited
# from it: entry-time injection happens once at the top of a task and is
# amortized across the run, whereas error-time entries are appended to an
# already-loaded context window and are re-read from cache on every remaining
# turn of that task. The marginal cost is paid per turn, not per task.
# Must be an integer >= 0; 0 disables error-time injection entirely. Anything
# else (strings, floats, booleans) falls back to 3. An explicit
# `--injection-limit` on the command line always wins over this value.
# heuristics:
#   error_injection_limit: 3

# ============================================================================
# Provenance Tracking
# ============================================================================

provenance:
  # require_hooks: when true, CI rejects commits missing Author-type or Operator trailers.
  # Hooks inject these locally; this catches --no-verify and hookless clones at PR time.
  require_hooks: true
  required_trailers:
    - Author-type
    - Operator
  recommended_trailers:
    - Spec
    - Plan-task
  # Conventional commit types accepted by commit-msg hook and CI.
  # Types not in this list are rejected. Scopes are optional and unconstrained.
  # Format: <type>[(<scope>)][!]: <description>
  conventional_commit_types:
    - feat       # New feature (bumps minor)
    - fix        # Bug fix (bumps patch)
    - docs       # Documentation only
    - style      # Formatting, no logic change
    - refactor   # Code restructuring, no behavior change
    - perf       # Performance improvement
    - test       # Adding or updating tests
    - build      # Build system or external dependencies
    - ci         # CI/CD configuration
    - chore      # Maintenance, tooling, housekeeping
    - revert     # Reverts a previous commit
    - deps       # Dependency updates
    - research   # Research artifacts

# ============================================================================
# Repo Map Configuration
# ============================================================================

repomap:
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - "*.min.js"
    - "*.generated.*"
    - ".claude/**"
    - ".adev/worktrees/**"
    - ".context-index/hygiene/**"
    # adev-api-eval is a full standalone eval-fixture project (its own
    # package.json/node_modules) with a checked-in dist/ that isn't real
    # adev-plugin source. Exclude patterns are root-anchored only (a
    # nested-anywhere match previously misfired on skills/build/, which
    # legitimately shares a name with the DEFAULT_EXCLUDE "build/**" entry),
    # so this nested dist/ needs its own explicit entry.
    - "tests/evals/adev-api-eval/dist/**"

# ============================================================================
# Hygiene
# ============================================================================

# ============================================================================
# Integrations
# ============================================================================

integrations:
  session_capture:
    provider: native
    capture: post-commit
    gitignored: false
hygiene:
  staleness_threshold_days: 30
  source_roots:
    - cli/
    - hooks/
    - lib/
    - providers/
    - skills/
    - templates/
  coverage_exclude:
    - "tests/**"
    - "skills/*/evals/**"
    - ".adev/worktrees/**"
    - ".claude/worktrees/**"
  # Test Debt (Pass 23) deliberately does NOT apply coverage_exclude above —
  # this is its own, separate exclusion key. Without it, worktree checkouts
  # under .adev/worktrees/**  and .claude/worktrees/** (each a full repo
  # checkout with its own duplicate test suite) get scanned as if they were
  # real project test debt.
  test_debt:
    exclude:
      - ".adev/worktrees/**"
      - ".claude/worktrees/**"
  plan_immutability:
    # One-time batch modifications the detector should ignore.
    #
    # PREFER `exempt_patch_ids` BELOW FOR NEW ENTRIES. A commit SHA does not
    # survive a history rewrite: `git filter-branch`, a rebase, or a squash
    # merge re-hashes every commit it touches, and an `exempt_commits` entry
    # recorded beforehand silently stops matching — the exemption evaporates
    # and the plan re-flags. That happened to every SHA in the list below
    # (a filter-branch on feat/session-history/session-end-hooks; the
    # pre-rewrite commits survive only under refs/original/). A patch id
    # hashes the diff rather than the commit, so it is invariant under
    # rewriting. Both lists are read; entries match if EITHER hits.
    #
    # Record a patch id with:
    #   git show <sha> --format= --patch | git patch-id --stable
    #
    # Use full 40-char values in both lists. Document the reason inline.
    exempt_commits:
      # 0.26.0 migration: stamped the DO-NOT-EDIT advisory header on 20 plan
      # files (chore: migrate context-index to 0.26.0 lifecycle-state shape).
      # Structural comment, not content change.
