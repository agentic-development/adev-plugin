# manifest.yaml — Agentic Development Framework Configuration
# Generated by /adev:init. Edit as needed, then run /adev:sync.

# ============================================================================
# Project Metadata
# ============================================================================

project:
  name: "adev-plugin"
  adev_version: "0.14.0"
  description: "Claude Code plugin and CLI implementing a full-lifecycle Agentic Development Framework"
  type: cli

# ============================================================================
# Sync Targets
# ============================================================================

sync:
  targets:
    - path: CLAUDE.md
      format: claude

# ============================================================================
# Modules
# ============================================================================

modules:
  - slug: cli
    name: CLI
    paths:
      - cli/

  - slug: hooks
    name: Hooks
    paths:
      - hooks/

  - slug: setup
    name: Setup
    paths:
      - skills/init/
      - skills/sync/
      - skills/using-adev/
      - templates/

  - slug: triage
    name: Triage
    paths:
      - skills/start/

  - slug: design
    name: Design
    paths:
      - skills/brainstorm/
      - skills/adev-brainstorm/
      - skills/specify/

  - slug: assessment
    name: Assessment
    paths:
      - skills/review-specs/
      - skills/route/
      - skills/assess/

  - slug: planning
    name: Planning
    paths:
      - skills/plan/
      - skills/adev-plan/

  - slug: implementation
    name: Implementation
    paths:
      - skills/implement/
      - skills/adev-implement/
      - skills/debug/
      - skills/recover/
      - skills/write-test/

  - slug: validation
    name: Validation
    paths:
      - skills/validate/
      - skills/eval/

  - slug: strategic-planning
    name: Strategic Planning
    paths:
      - skills/vision/
      - skills/roadmap/
      - skills/research/
      - skills/build/
      - skills/issues/
      - skills/status/
      - skills/document/

  - slug: maintenance
    name: Maintenance
    paths:
      - skills/hygiene/
      - skills/repomap/
      - skills/codehealth/
      - skills/sample/
      - skills/retro/
      - skills/reconcile/

# ============================================================================
# External Contexts
# ============================================================================

external_contexts: []

# ============================================================================
# Specialists
# ============================================================================

specialists: []

# ============================================================================
# Quality Gates
# ============================================================================

gates:
  test: "npm test"

# ============================================================================
# Completion Policy
# ============================================================================

completion:
  merge_policy: pr
  protected_branches:
    - main
    - master
  branch_naming: "<type>/<module>/<short-description>"

# ============================================================================
# Task Management
# ============================================================================

tasks:
  backend: file

# ============================================================================
# Provenance Tracking
# ============================================================================

provenance:
  # require_hooks: when true, CI rejects commits missing Author-type or Operator trailers.
  # Hooks inject these locally; this catches --no-verify and hookless clones at PR time.
  require_hooks: true
  required_trailers:
    - Author-type
    - Operator

# ============================================================================
# Repo Map Configuration
# ============================================================================

repomap:
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - "*.min.js"
    - "*.generated.*"

# ============================================================================
# Hygiene
# ============================================================================

# ============================================================================
# Integrations
# ============================================================================

integrations:
  session_capture:
    provider: native

hygiene:
  staleness_threshold_days: 30
  source_roots:
    - cli/
    - hooks/
    - lib/
    - providers/
    - skills/
    - templates/
  coverage_exclude:
    - "tests/**"
    - "skills/*/evals/**"
