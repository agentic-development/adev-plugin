# Legacy weighted rubric fixture — the pre-migration shape the loader must
# REFUSE, modelled on tests/evals/skill-compression/rubrics/*.yaml.
#
# Identical to conforming.yaml except that both quality_dimensions entries
# carry a numeric `weight`. Deliberate properties the suite depends on:
#   - readability_naming carries `weight: 3` (inside the historical 1-5 scale)
#   - separation_of_concerns carries `weight: 9` (OUTSIDE it), so the suite can
#     prove detection triggers on the PRESENCE of a numeric weight rather than
#     on a 1-5 range check — the binary-verdict schema has no `weight` field at
#     all, so any numeric weight predates the migration
#   - every other key clears the earlier passes, so the load reaches the
#     legacy-scale pass and fails there rather than incidentally

rubric_id: "fixture-legacy-weight-scale"
version: 1
layer: 3
verdict_values: "met | not_met | unknown (judged criteria) | not_applicable (deterministic elements)"

required_elements:
  - id: spec_criteria_referenced
    description: "Every acceptance criterion in the spec is referenced verbatim by an added or modified test"
    source: "the Live Spec's acceptance-criteria list, matched against test names and assertion messages in the diff"
    met_when: "each criterion's identifier, or its literal wording, appears in at least one test name or assertion message"
    not_applicable_when: "the spec declares no acceptance criteria — record NOT_APPLICABLE"

  - id: tests_accompany_source
    description: "Every changed non-test source file has an added or modified test in the same diff"
    source: "the diff file list"
    met_when: "no changed source file lacks a corresponding test change"
    not_applicable_when: "never — the diff file list always answers this"

quality_dimensions:
  - id: readability_naming
    criterion: "Can a developer unfamiliar with this module state what each newly added symbol does from its name and signature alone?"
    reference: "the matched golden sample in .context-index/samples/, else the naming conventions in the constitution"
    met_when: "every new symbol's name and signature convey its purpose without reading its body"
    not_met_when: "at least one new symbol requires reading its body to know what it does"
    unknown_when: "no golden sample and no naming convention is declared, so there is no anchor to compare against"
    weight: 3

  - id: separation_of_concerns
    criterion: "Does each changed file hold a single responsibility, at the same boundary the reference draws?"
    reference: "the matched golden sample's file/module split, else the Architecture Boundaries section of the constitution"
    met_when: "no changed file mixes responsibilities the reference keeps apart"
    not_met_when: "at least one changed file merges responsibilities the reference separates"
    unknown_when: "the diff touches no file the reference covers"
    weight: 9

layer3_max_points: 25
required_element_points: 10
judged_criterion_points: 15
unknown_policy: "exclude_from_denominator"
not_applicable_policy: "exclude_from_denominator"
insufficient_evidence_threshold_percent: 40
