project:
  name: "dbt-models"
  description: "dbt transformation layer"
  type: library

sync:
  targets:
    - path: CLAUDE.md
      format: claude

modules:
  - slug: staging
    name: Staging Models
    paths:
      - models/staging/

  - slug: intermediate
    name: Intermediate Models
    paths:
      - models/intermediate/

  - slug: marts
    name: Mart Models
    paths:
      - models/marts/

specialists: []

gates:
  test: "dbt test"
  compile: "dbt compile"

completion:
  merge_policy: pr
  protected_branches:
    - main

tasks:
  backend: file

hygiene:
  staleness_threshold_days: 30
  source_roots:
    - models/
