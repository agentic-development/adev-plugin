project:
  name: "airflow-dags"
  description: "Airflow orchestration layer"
  type: single-app

sync:
  targets:
    - path: CLAUDE.md
      format: claude

modules:
  - slug: dags
    name: DAGs
    paths:
      - dags/

specialists: []

gates:
  test: "pytest"
  dag-parse: "python -m airflow dags list"

completion:
  merge_policy: pr
  protected_branches:
    - main

tasks:
  backend: file

hygiene:
  staleness_threshold_days: 30
  source_roots:
    - dags/
