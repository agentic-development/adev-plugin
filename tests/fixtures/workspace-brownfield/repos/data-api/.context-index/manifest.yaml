project:
  name: "data-api"
  description: "REST API serving analytics metrics"
  type: single-app

sync:
  targets:
    - path: CLAUDE.md
      format: claude

modules:
  - slug: routes
    name: Routes
    paths:
      - src/routes/

  - slug: middleware
    name: Middleware
    paths:
      - src/middleware/

  - slug: db
    name: Database Layer
    paths:
      - src/db/

specialists: []

gates:
  test: "npm test"
  lint: "npm run lint"

completion:
  merge_policy: pr
  protected_branches:
    - main

tasks:
  backend: file

hygiene:
  staleness_threshold_days: 30
  source_roots:
    - src/
