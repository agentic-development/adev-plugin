# Rubric: adev-brainstorm skill evaluation
# Scores skill output on required elements (binary) and quality dimensions (1-5)

skill: adev-brainstorm
scenario: brainstorm-scenario

# Required elements — binary pass/fail
required_elements:
  - id: context_exploration
    description: "Loaded and summarized existing project context"
    match_pattern: "constitution|existing.*charter|platform.*context|context.*summary"

  - id: clarifying_questions
    description: "Asked focused clarifying questions about the feature idea"
    match_pattern: "\\?|What.*problem|Which.*module|scope"

  - id: approach_proposals
    description: "Proposed 2-3 approaches with trade-offs"
    match_pattern: "Approach|Option|trade-off|Trade-off|pros|cons|recommend"

  - id: constitution_check
    description: "Validated approaches against constitutional principles"
    match_pattern: "constitution|principle|Non-Negotiable|compliance"

  - id: business_intent
    description: "Defined Business Intent section"
    match_pattern: "Business Intent|business intent|why.*module exists"

  - id: scope_boundaries
    description: "Defined Scope and Boundaries (in/out of scope)"
    match_pattern: "In Scope|Out of Scope|scope.*boundar"

  - id: domain_model
    description: "Defined Domain Model with entities"
    match_pattern: "Domain Model|domain model|entit"

  - id: capability_map
    description: "Defined Capability Map with priorities"
    match_pattern: "Capability Map|capability.*map|must-have|should-have"

  - id: interface_contracts
    description: "Defined Interface Contracts"
    match_pattern: "Interface Contract|interface.*contract|Exposed API|Consumed API"

  - id: charter_file_path
    description: "Specified correct charter output path"
    match_pattern: "\\.context-index/specs/features/.*charter\\.md"

  - id: transition_to_specify
    description: "Transitioned to /adev-specify at the end"
    match_pattern: "/adev-specify"

# Quality dimensions — scored 1-5 by LLM judge
quality_dimensions:
  - id: completeness
    description: "All charter sections are present and substantive"
    weight: 2

  - id: scope_clarity
    description: "In/Out of scope are specific enough to resolve ownership disputes"
    weight: 1.5

  - id: constitution_compliance
    description: "Design decisions align with constitutional principles"
    weight: 1.5

  - id: cross_charter_awareness
    description: "Checks for conflicts with existing charters, no capability overlap"
    weight: 1

  - id: interactive_flow
    description: "One question at a time, multiple choice preferred, incremental validation"
    weight: 1

  - id: yagni
    description: "No unnecessary capabilities beyond what was requested"
    weight: 1

scoring:
  required_element_weight: 50
  quality_dimension_weight: 50
