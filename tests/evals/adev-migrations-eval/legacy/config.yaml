sources:
  customers: data/source/customers.csv
  orders: data/source/orders.csv
  products: data/source/products.csv
output:
  path: data/output/legacy
joins:
  orders_customers:
    left: orders
    right: customers
    key: customer_id
columns:
  order_summary:
    - customer_id
    - customer_name
    - total_orders
    - total_revenue
    - avg_order_value
