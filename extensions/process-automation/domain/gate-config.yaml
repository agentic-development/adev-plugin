file_exclusions:
  - ".context-index/**"
  - "*.test.*"
  - "*.spec.*"
  - "__tests__/**"
  - "README.md"
  - "README.*.md"
  - "CHANGELOG.md"
  - "CONTRIBUTING.md"
  - "LICENSE*"
  - "docs/**"
  - "package.json"
  - "package-lock.json"
  - "*.config.*"
  - ".gitignore"
  - ".gitmodules"
  - "node_modules/**"
  - ".git/**"
  - "*.workflow.yaml"
  - "*.bpmn"
  - "flows/**"
  - "*.flow.json"
  - "logs/**"

bash_passthrough:
  - "git status"
  - "git log"
  - "git diff"
  - "git branch"
  - "git show"
  - "git blame"
  - "ls"
  - "cat"
  - "head"
  - "tail"
  - "find"
  - "grep"
  - "rg"
  - "wc"
  - "file"
  - "which"
  - "echo"
  - "printf"
  - "python -m pytest"
  - "pytest"
  - "npm test"
  - "npx jest"
  - "node --test"
  - "pwd"
  - "env"
  - "date"
