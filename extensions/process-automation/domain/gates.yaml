gates:
  - id: flow-coverage
    description: "Check integration point tests and recovery action tests"
    command: ["npm", "test"]
    severity: error
    tier: fast
  - id: integration-test
    description: "Run integration tests (no-op until a test:integration script exists)"
    command: ["npm", "run", "--if-present", "test:integration"]
    severity: error
    tier: integration
