gates:
  - id: data-quality
    description: "Check schema validation and data fixture definitions"
    command: ["npm", "test"]
    severity: error
    tier: fast
  - id: integration-test
    description: "Run integration tests (no-op until a test:integration script exists)"
    command: ["npm", "run", "--if-present", "test:integration"]
    severity: error
    tier: integration
