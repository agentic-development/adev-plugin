# ============================================================================
# Quality Gates
# Gate definitions have moved to governance/gates.yaml.
# Run /adev:init (Step 7) to scaffold governance files.
# ============================================================================

# ============================================================================
# Completion Policy
# Controls what happens after implementation and validation pass.
# ============================================================================

completion:
  merge_policy: pr          # pr | merge | ask
  # pr:    Always open a pull request. Never merge directly. (default, recommended)
  # merge: Allow direct merge to the target branch after validation passes.
  # ask:   Ask the user each time whether to open a PR or merge.
  protected_branches:
    - main
    - master
  # Branches that agents must NEVER merge to or push to directly,
  # regardless of merge_policy. Always open a PR for these.
  allow_agent_pr_merge: false
  # May an agent run `gh pr merge` to complete a PR? Default false — opening the
  # PR is never gated, but completing it is, because merging is the point where
  # review is enforced. Set true in solo/automated repos where the alternative
  # is a human re-running the identical command.
  branch_naming: "<type>/<module>/<short-description>"
  # Convention for feature branch names. Not enforced, but referenced by skills.
  # <type>:  feat | fix | chore | spike | refactor | docs
  # <module>: charter module name (same scope as commit messages)
  # <short-description>: kebab-case, 2-4 words
  # Examples: feat/auth/login-flow, fix/payments/webhook-retry

# ============================================================================
# Task Management
# Controls how /adev:plan and /adev:implement track issue progress.
# ============================================================================

# ============================================================================
# Provenance Tracking
# ============================================================================

provenance:
  # require_hooks: when true, CI rejects commits missing Author-type or Operator trailers.
  # Hooks inject these locally; this catches --no-verify and hookless clones at PR time.
  # Set to false to disable CI enforcement (hooks still inject trailers locally).
  require_hooks: true
  required_trailers:
    - Author-type
    - Operator

# ============================================================================
# Task Management
# ============================================================================

tasks:
  # Backend for issue tracking:
  #   json  — JSON document at .context-index/tasks/tasks.json (default, zero setup)
  #           Recommended. Writes use atomic temp-then-rename.
  #   file  — markdown table at .context-index/tasks/tasks.md
  #           READ-ONLY-DEPRECATED. Writes throw BACKEND_READ_ONLY_DEPRECATED.
  #           Run `adev migrate` to convert to json, or set backend: json here.
  #   beads — beads_rust CLI (br), local-first git-native issue tracker
  #           Install: https://github.com/Dicklesworthstone/beads_rust
  backend: json
  # Tool calls between issue reminders. 0 to disable. Default: 25.
  reminder_interval: 25
  # claim_ttl_minutes: lease window for `adev issues claim`. Default: 240 (4h).
  #   A claim is a lease, not a lock: once claimed_at is older than this, the
  #   claim is STALE and the next claimant takes it over with a fresh
  #   claimed_at, so a crashed session cannot hold an issue forever. A LIVE
  #   claim by another owner is still refused (ISSUE_ALREADY_CLAIMED).
  #   Set 0 to disable expiry (claims live until explicitly released).
  #   Must be an integer >= 1, or 0; anything else is rejected at load.
  #   List expired leases with `adev issues stale [--json]`.
  # claim_ttl_minutes: 240
  # bugfix_loop.attempt_cap: per-issue attempt cap for /adev:bugfix-loop's
  #   auto-retry (per-issue-attempt-cap.spec.md). Default: 2. An issue whose
  #   AttemptRecord.last_verdict lands on NO_PROGRESS, REGRESSED, or
  #   BUDGET_EXHAUSTED is excluded from `adev issues next` until cleared.
  # bugfix_loop.reproduction_attempt_limit: bounded reproduction-try limit for
  #   /adev:debug --auto's Phase 1 (debug-completion-and-auto.spec.md). Default: 3.
  #   Distinct from bugfix_loop.attempt_cap (per-issue-attempt-cap.spec.md) — this
  #   counts intra-invocation reproduction tries, never leaving a single
  #   /adev:debug --auto run; attempt_cap counts completed invocations.
  # bugfix_loop:
  #   attempt_cap: 2
  #   reproduction_attempt_limit: 3
  # legacy_read: enabled | disabled
  #   When set to "enabled" (default) and tasks.json is absent, the json
  #   adapter falls back to reading tasks.md via the shared markdown parser.
  #   Set to "disabled" to skip the fallback and always return the empty board
  #   when tasks.json is missing.
  # legacy_read: enabled
  # db_path: /absolute/path/to/shared/root
  #   Optional — override the storage root for issue data.
  #   Useful when multiple git worktrees need to share a single issue database.
  #   When omitted, the main repo root is auto-resolved via git.
  #   tasks.db_path also governs milestones.json location (unified knob):
  #   the same override resolves both
  #     <db_path>/.context-index/tasks/tasks.json   (issue board)
  #     <db_path>/.context-index/milestones.json    (milestone registry)
  #
  # tier_prefixes: Custom prefix → tier label map for the tiered hierarchy.
  #   Default (when omitted): { e: "Epic", f: "Feature", t: "Task" }
  #   IDs use dotted notation: e1, e1.f2, e1.f2.t3
  #   Rules:
  #   - Prefixes must not conflict with legacy ID prefixes (epic, issue, bd)
  #   - Each prefix must map to a unique tier label
  #   Example — outcome-driven hierarchy:
  # tier_prefixes:
  #   x: "Outcome"
  #   y: "Initiative"
  #   z: "Step"

# ============================================================================
# Lifecycle State
# ============================================================================

# Controls how lib/lifecycle-state.mjs::requireGate behaves on a
# missing/failed prior step.
#   strict   — throw GateError (default)
#   advisory — emit console.warn and continue
#
# Controls write-time Tier-1 / event-impact diagnostics that fire on every
# call to lib/lifecycle-state.mjs::appendEvent.
#   strict — event-impact diagnostics fire before writing; any error-severity
#            firing throws GateError and the event is NOT persisted.
#   tag    — (default) event-impact diagnostics fire before writing; firings
#            are merged into the event's diagnostic_warnings field, and the
#            event is persisted with the inline tags.
#   off    — diagnostics engine not invoked. Pre-rev-2 baseline behavior.
#            Use in test fixtures and during incremental rollouts; the
#            default tag mode is non-blocking (writes always succeed).
#
# Controls whether lib/lifecycle-state.mjs::reportStep refuses an orphan
# step_completed/step_failed — one with no matching lifecycle_step "started"
# event for the same step + revision already in the log.
#   strict — refuse with ORPHAN_STEP_EVENT before writing (no side effect).
#            Recommended for any project whose downstream steps gate on
#            `adev gate require` / `requireGate`, since an orphan terminal
#            event is otherwise indistinguishable from a legitimate one once
#            it lands on disk.
#   off    — (default) no check; pre-existing baseline behavior. Kept as the
#            default because reportStep is also used as a bare low-level
#            primitive (by tests and ad hoc tooling) to seed step state
#            without simulating a full started→completed sequence.
# lifecycle:
#   gate_mode: strict
#   event_diagnostics: tag
#   step_pairing: strict

# ============================================================================
# Repo Map Configuration
# Controls how /adev:repomap scans the repository.
# ============================================================================

repomap:
  # File patterns to exclude from the repo map (in addition to .gitignore)
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - ".next/**"
    - "coverage/**"
    - "*.min.js"
    - "*.generated.*"
  # Supported languages are auto-detected. Override here if needed:
  # languages:
  #   - typescript
  #   - python

# ============================================================================
# Hygiene
# Configuration for /adev:hygiene audits.
# ============================================================================

# ============================================================================
# Governance (Optional)
# Declarative quality gates, boundary rules, and risk policies.
# Stored in .context-index/governance/. Run /adev:init to scaffold.
# ============================================================================

# ============================================================================
# Setup
# Scaffold-time install behavior. Run at every `adev install` / `adev upgrade`.
# Distinct from `integrations:` (which gates runtime-feature install behavior
# for opt-in integrations like session-capture).
# ============================================================================

# setup:
#   # When true (default), `adev install` and `adev upgrade` write or refresh
#   # an `adev:gitignore` paired-marker block in your project's .gitignore
#   # listing ephemeral adev artifacts (lifecycle state, atomic-write temps,
#   # partial writes, prototype workspace, etc.). The canonical path list lives
#   # in lib/gitignore-paths.mjs.
#   #
#   # Set to false to opt out. Existing blocks are NOT removed automatically;
#   # run `adev init ensure-gitignore --remove` to excise an installed block
#   # (the --remove subverb always bypasses this knob).
#   managed_gitignore: true

# ============================================================================
# Integrations
# External tool integrations for session capture, notifications, etc.
# ============================================================================

integrations:
  session_capture:
    # Provider for capturing agent session transcripts.
    # Options:
    #   native  — use built-in session logging (writes to .context-index/sessions/)
    #   none    — no session capture (default)
    provider: none

hygiene:
  # Number of days before a spec is considered stale
  staleness_threshold_days: 30
  # Directories to check for charter coverage
  source_roots:
    - src/
  # Patterns to ignore in coverage checks
  coverage_exclude:
    - "src/**/*.test.*"
    - "src/**/*.spec.*"
    - "src/**/test/**"
    - "src/**/__tests__/**"
