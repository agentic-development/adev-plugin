# Bundled validate check registry defaults.
# See: .context-index/specs/features/validation/configurable-checks.md rev 3.
#
# Check 1 (quality gates) is sourced from governance/gates.yaml by a separate
# flow in skills/validate/SKILL.md and is not represented here. All other
# checks are registry entries; the `internal: true` flag indicates the check's
# subagent prompt is inlined in skills/validate/SKILL.md prose during the v1
# migration. Projects adding new subagent-review checks must supply a `prompt`.

checks:
  - id: validate.check-1.5-source-manifest
    name: "Source Manifest Verification"
    kind: deterministic-check
    severity: warning
    internal: true
    description: "Verify spec source-manifest SHAs match current files."

  - id: validate.check-2-spec-compliance
    name: "Spec Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: error
    internal: true
    after: [validate.check-1.5-source-manifest]

  - id: validate.check-3-charter-consistency
    name: "Charter Consistency"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: error
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-4-constitution
    name: "Constitutional Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: error
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-5-adrs
    name: "ADR Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: warning
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-6-cross-cutting
    name: "Cross-Cutting Spec Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: warning
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-7-specialist-review
    name: "Specialist Review"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: warning
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-8-boundaries
    name: "Governance Boundaries"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: error
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-9-transition-gates
    name: "Transition Gate Compliance"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: warning
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-10-platform-drift
    name: "Platform Drift"
    kind: subagent-review
    profile: reviewer-capable
    context_pack: base
    severity: warning
    internal: true
    after: [validate.check-2-spec-compliance]

  - id: validate.check-11-visual-verification
    name: "Visual Verification"
    kind: subagent-review
    profile: browser-review
    context_pack: base
    severity: warning
    internal: true

  - id: validate.check-12-heuristic-extraction
    name: "Heuristic Extraction"
    kind: observational
    severity: info
    internal: true
