# diagnostics.yaml — Diagnostic registry entries
# This file lives at .context-index/governance/diagnostics.yaml
# Generated by /adev:init. Edit as needed.
#
# Each entry declares a single diagnostic that the engine
# (lib/diagnostics/index.mjs::runDiagnostics) iterates and dispatches.
# Spec authority: .context-index/specs/features/cli-driver-surface/diagnostic-registry.spec.md
#
# Entry schema (per Behavior 1 + Behavior 2):
#   id:        (required) Globally unique kebab-case ID, "adev/<aspect>" or "<vendor>/<aspect>".
#   runner:    (required) Path to the runner module. Must carry an explicit prefix:
#                "plugin:<rel>"   → resolves under <pluginRoot>/lib/diagnostics/
#                "project:<rel>"  → resolves under <projectRoot>/.context-index/diagnostics/
#              Absolute paths and unprefixed relative paths are rejected (SCHEMA_INVALID).
#              ".." path components are rejected on the raw input.
#   severity:  info | warning | error
#   tier:      1 | 2 | 3   (1 = event-impact, runs on every appendEvent;
#                            2 = on-demand schema validators;
#                            3 = on-demand citation / grounding checks)
#   scope:     event-impact | spec | workspace
#
# Duplicate IDs are first-wins: bundled plugin: entries cannot be silently
# shadowed by later project: entries; subsequent duplicates emit
# adev/diagnostic-duplicate-id (warning) and are dropped.

diagnostics:
  - id: adev/event-schema-valid
    runner: plugin:tier1/event-schema-valid.mjs
    severity: error
    tier: 1
    scope: event-impact

  - id: adev/status-enum-legal
    runner: plugin:tier1/status-enum-legal.mjs
    severity: error
    tier: 1
    scope: event-impact

  - id: adev/frontmatter-present
    runner: plugin:tier1/frontmatter-present.mjs
    severity: error
    tier: 1
    scope: event-impact

