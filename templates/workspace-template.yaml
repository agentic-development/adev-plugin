# adev-workspace.yaml — Multi-Repo Workspace Configuration
# This file declares the repos in a workspace and their dependencies.
# Generated by /adev:init --workspace. Edit as needed.

workspace:
  name: "{{ workspace_name }}"

# Registered repositories
# Each repo has its own .context-index/ and can be independently initialized.
repos:
  # - slug: my-repo              # Unique identifier (used in cross-repo refs)
  #   path: ./repos/my-repo      # Relative path from workspace root
  #   role: transformation       # Free-form label (optional)

# Inter-repo dependencies (optional)
# Convention: "from" depends on "to" — "to" is upstream.
# The type field is informational and does not affect execution order.
dependencies: []
  # - from: api-service
  #   to: data-models
  #   type: consumes             # Free-form: consumes, orchestrates, deploys, etc.
