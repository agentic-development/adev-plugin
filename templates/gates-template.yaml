# Lifecycle transition requirements
#
# Left live and empty on purpose. The charter invariant requires every id listed in
# transitions.*.required_gates to exist in `gates`, and /adev:hygiene Pass 8 enforces
# it — binding implement-to-validate to `test` while its command is still the unwired
# sentinel would make a fresh scaffold fail closed. Populate this only after the gates
# it names carry real argv commands.
