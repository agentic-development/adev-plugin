# Bundled reviewer registry defaults.
# See: .context-index/specs/features/review/configurable-reviewers.spec.md rev 3.
#
# Projects override these via .context-index/governance/review.yaml. Matching
# `id` overrides field-by-field; new `id` appends. Overriding a bundled
# reviewer's `prompt` or `package` emits an informational WARN at load.

reviewers:
  - id: structural-architect
    name: "Structural Architect"
    dispatch: always
    prompt: plugin:review-specs/structural-architect-prompt.md
    profile: reviewer-reasoning
    context_pack: architecture
    severity_cap: blocker

  - id: security-reviewer
    name: "Security Reviewer"
    dispatch: always
    prompt: plugin:review-specs/security-reviewer-prompt.md
    profile: reviewer-capable
    context_pack: security
    severity_cap: blocker

  - id: consistency-analyzer
    name: "Consistency Analyzer"
    dispatch: always
    prompt: plugin:review-specs/consistency-analyzer-prompt.md
    profile: reviewer-fast
    context_pack: consistency
    severity_cap: blocker

context_packs:
  # `base` is SHARED with configurable-checks (three checks in
  # templates/domains/software/validate.yaml reference it, at lines 54, 69 and
  # 113). It stays
  # target-agnostic: renderable with no targetSpecPath. Never add a
  # <charter-dir> or <target-spec> token here.
  base:
    max_file_bytes: 16384
    max_total_bytes: 262144
    include:
      - glob: .context-index/constitution.md
        title: Constitution
      - glob: .context-index/platform-context.yaml
        title: Platform Context

  # Review-only. REQUIRES a targetSpecPath (Behavior 22e).
  review-base:
    extends: base
    include:
      - glob: <charter-dir>/charter.md
        title: Parent Charter
      - glob: <charter-dir>/*.spec.md
        exclude: ["<target-spec>"]
        title: Sibling Specs

  architecture:
    extends: review-base
    include:
      - glob: .context-index/adrs/*.md
        title: ADRs

  security:
    extends: review-base
    include:
      - glob: .context-index/adrs/*.md
        title: ADRs
      # Enumerated, NOT `.context-index/governance/*.yaml`: a wildcard over a
      # config directory silently widens what reaches an LLM prompt.
      - glob: .context-index/governance/risk-policies.yaml
        title: Risk Policies
      - glob: .context-index/governance/gates.yaml
        title: Transition Gates

  consistency:
    extends: review-base
    # ADRs push this pack's real corpus past the shared 262144-byte default once
    # the aggregate truncation notice (Behavior 22m, deliberately exempt from the
    # cap it reports on) is accounted for. Trimmed slightly below the shared
    # default so the notice-inclusive render still lands under 262144 overall.
    max_total_bytes: 260000
    include:
      - glob: .context-index/adrs/*.md
        title: ADRs
      # Recursive (`**`), not `*`: cross-cutting specs may live one level down
      # in a per-topic directory (e.g. cross-cutting/completion-tokens/
      # completion-tokens.spec.md). A non-recursive glob made those specs
      # unreachable at ANY budget, which produced a false `blocker` finding
      # when a reviewer was asked to verify a citation against a spec that had
      # never been delivered to it (2026-08-20).
      - glob: .context-index/specs/cross-cutting/**/*.spec.md
        title: Cross-Cutting Specs

  referent-integrity:
    extends: base
    include:
      - glob: docs/cli-reference.md
        title: CLI Reference
      - glob: docs/skill-reference.md
        title: Skill Reference
      - glob: .context-index/orientation/architecture.md
        title: Architecture Orientation

  # wiring-reviewer does its own producer/consumer lookup via its filesystem-read
  # and search grant; this pack exists only to give it an explicit, non-`base`
  # context_pack identity (context_pack defaults to "base" per
  # lib/governance/review-config.mjs, deliberately target-agnostic — leaving
  # wiring-reviewer unspecified would silently under-deliver).
  wiring:
    extends: review-base

verdict_rules:
  blocker_threshold: 1
