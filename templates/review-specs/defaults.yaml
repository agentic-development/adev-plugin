# Bundled reviewer registry defaults.
# See: .context-index/specs/features/review/configurable-reviewers.spec.md rev 3.
#
# Projects override these via .context-index/governance/review.yaml. Matching
# `id` overrides field-by-field; new `id` appends. Overriding a bundled
# reviewer's `prompt` or `package` emits an informational WARN at load.

reviewers:
  - id: structural-architect
    name: "Structural Architect"
    dispatch: always
    prompt: plugin:review-specs/structural-architect-prompt.md
    profile: reviewer-reasoning
    context_pack: architecture
    severity_cap: blocker

  - id: security-reviewer
    name: "Security Reviewer"
    dispatch: always
    prompt: plugin:review-specs/security-reviewer-prompt.md
    profile: reviewer-capable
    context_pack: security
    severity_cap: blocker

  - id: consistency-analyzer
    name: "Consistency Analyzer"
    dispatch: always
    prompt: plugin:review-specs/consistency-analyzer-prompt.md
    profile: reviewer-fast
    context_pack: consistency
    severity_cap: blocker

context_packs:
  # `base` is SHARED with configurable-checks (five checks in
  # templates/domains/software/validate.yaml reference it). It stays
  # target-agnostic: renderable with no targetSpecPath. Never add a
  # <charter-dir> or <target-spec> token here.
  base:
    max_file_bytes: 16384
    max_total_bytes: 262144
    include:
      - glob: .context-index/constitution.md
        title: Constitution
      - glob: .context-index/platform-context.yaml
        title: Platform Context

  # Review-only. REQUIRES a targetSpecPath (Behavior 22e).
  review-base:
    extends: base
    include:
      - glob: <charter-dir>/charter.md
        title: Parent Charter
      - glob: <charter-dir>/*.spec.md
        exclude: ["<target-spec>"]
        title: Sibling Specs

  architecture:
    extends: review-base
    include:
      - glob: .context-index/adrs/*.md
        title: ADRs

  security:
    extends: review-base
    include:
      - glob: .context-index/adrs/*.md
        title: ADRs
      # Enumerated, NOT `.context-index/governance/*.yaml`: a wildcard over a
      # config directory silently widens what reaches an LLM prompt.
      - glob: .context-index/governance/risk-policies.yaml
        title: Risk Policies
      - glob: .context-index/governance/gates.yaml
        title: Transition Gates

  consistency:
    extends: review-base
    include:
      - glob: .context-index/specs/cross-cutting/*.md
        title: Cross-Cutting Specs

verdict_rules:
  blocker_threshold: 1
