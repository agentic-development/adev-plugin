# Validate registry overlay for the "prototype" risk tier.
# Applied on top of the operator's own Step 7c/7d selection during
# /adev:init Step 7d.0, before any manual customization. Disables the
# heaviest check (visual verification needs a real UI + Playwright, rarely
# worth the wait on a throwaway prototype) and downgrades spec/constitution
# compliance to warning so a prototype's validate run reports rather than
# blocks.
# See lib/risk-tiers/merge-validate-overlay.mjs.

disable:
  - validate.check-11-visual-verification

severity_overrides:
  validate.check-2-spec-compliance: warning
  validate.check-4-constitution: warning
