file_exclusions:
  - ".context-index/**"
  - "*.test.*"
  - "*.spec.*"
  - "__tests__/**"
  - "README.md"
  - "README.*.md"
  - "CHANGELOG.md"
  - "CONTRIBUTING.md"
  - "LICENSE*"
  - "docs/**"
  - "package.json"
  - "package-lock.json"
  - "*.config.*"
  - ".gitignore"
  - ".gitmodules"
  - "node_modules/**"
  - ".git/**"
  - "*.parquet"
  - "*.duckdb"
  - "seeds/**"
  - "target/**"
  - "logs/**"
  - "*.csv"

bash_passthrough:
  - "git status"
  - "git log"
  - "git diff"
  - "git branch"
  - "git show"
  - "git blame"
  - "ls"
  - "cat"
  - "head"
  - "tail"
  - "find"
  - "grep"
  - "rg"
  - "wc"
  - "file"
  - "which"
  - "echo"
  - "printf"
  - "dbt run"
  - "dbt test"
  - "dbt build"
  - "dbt compile"
  - "dbt debug"
  - "python -m pytest"
  - "pytest"
  - "npm test"
  - "node --test"
  - "pwd"
  - "env"
  - "date"
