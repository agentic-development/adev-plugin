gates:
  - id: quality-gate
    description: "Run project test suite"
    command: ["npm", "test"]
    severity: error
    tier: fast
  - id: integration-test
    description: "Run integration tests (no-op until a test:integration script exists)"
    command: ["npm", "run", "--if-present", "test:integration"]
    severity: error
    tier: integration
