file_exclusions:
  - ".context-index/**"
  - "*.test.*"
  - "*.spec.*"
  - "__tests__/**"
  - "README.md"
  - "README.*.md"
  - "CHANGELOG.md"
  - "CONTRIBUTING.md"
  - "LICENSE*"
  - "docs/**"
  - "package.json"
  - "package-lock.json"
  - "*.config.*"
  - "tsconfig*"
  - ".eslintrc*"
  - ".prettierrc*"
  - ".gitignore"
  - ".gitmodules"
  - "node_modules/**"
  - ".git/**"
  - ".claude-plugin/**"
  - ".adev/**"
  - "CLAUDE.md"
  - "AGENTS.md"
  - ".cursorrules"
  - "providers/**"
  - "templates/**"

bash_passthrough:
  - "git status"
  - "git log"
  - "git diff"
  - "git branch"
  - "git show"
  - "git blame"
  - "ls"
  - "cat"
  - "head"
  - "tail"
  - "find"
  - "grep"
  - "rg"
  - "wc"
  - "file"
  - "which"
  - "echo"
  - "printf"
  - "node --test"
  - "npm test"
  - "npm run test"
  - "npm run lint"
  - "npm run typecheck"
  - "npx jest"
  - "npx vitest"
  - "npx tsc --noEmit"
  - "pwd"
  - "env"
  - "whoami"
  - "date"
  - "uname"
